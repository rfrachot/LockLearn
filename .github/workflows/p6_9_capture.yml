name: P6.9 canonical screenshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.ref == 'refs/heads/feat/p6-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p6-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Capture tested panel
        working-directory: frontend
        run: npm run docs:screenshot
      - name: Verify PNG
        run: |
          test -s docs/assets/locklearn-home.png
          file docs/assets/locklearn-home.png
          sha256sum docs/assets/locklearn-home.png
      - name: Commit canonical screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/locklearn-home.png
          git commit -m "docs(hardening): add canonical P6.9 panel screenshot [skip ci]"
          git push origin HEAD:feat/p6-hardening
