name: Build bundled Japanese Starter

on:
  push:
    paths:
      - "datasets/manifests/.starter-build-trigger"

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p1-content-core
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          check-latest: true
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Generate one-purpose starter signing key
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          key = Ed25519PrivateKey.generate()
          private_raw = key.private_bytes(
              serialization.Encoding.Raw,
              serialization.PrivateFormat.Raw,
              serialization.NoEncryption(),
          )
          public_raw = key.public_key().public_bytes(
              serialization.Encoding.Raw,
              serialization.PublicFormat.Raw,
          )
          Path("/tmp/starter-private.b64").write_text(
              base64.b64encode(private_raw).decode("ascii"), encoding="ascii"
          )
          registry = {
              "schema_version": 1,
              "keys": [
                  {
                      "key_id": "locklearn-starter-2026-01",
                      "public_key_b64": base64.b64encode(public_raw).decode("ascii"),
                      "valid_from": "2026-09-22T00:00:00Z",
                      "valid_until": "2036-01-01T00:00:00Z",
                      "status": "active",
                  }
              ],
          }
          Path("custom_components/locklearn/datasets/resources/signing_keys.json").write_text(
              json.dumps(registry, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Build signed starter
        shell: bash
        run: |
          export LOCKLEARN_DATASET_SIGNING_KEY_B64="$(cat /tmp/starter-private.b64)"
          python datasets/tools/build_dataset.py             datasets/manifests/japanese-starter-1.0.0.json             --output /tmp/starter-dist             --workspace /tmp/starter-work             --repository-root .
          unset LOCKLEARN_DATASET_SIGNING_KEY_B64
          rm -f /tmp/starter-private.b64
          mkdir -p custom_components/locklearn/datasets/bundled
          cp /tmp/starter-dist/locklearn-dataset-japanese-starter-1.0.0.zip             custom_components/locklearn/datasets/bundled/japanese-starter-1.0.0.zip
      - name: Write bundled metadata and discovery catalog
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          artifact = Path(
              "custom_components/locklearn/datasets/bundled/japanese-starter-1.0.0.zip"
          )
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          size = artifact.stat().st_size

          bundled = {
              "schema_version": 1,
              "datasets": [
                  {
                      "dataset_id": "locklearn:dataset:japanese-starter",
                      "version": "1.0.0",
                      "path": "bundled/japanese-starter-1.0.0.zip",
                      "sha256": digest,
                      "size": size,
                  }
              ],
          }
          Path(
              "custom_components/locklearn/datasets/resources/bundled_datasets.json"
          ).write_text(json.dumps(bundled, indent=2) + "\n", encoding="utf-8")

          catalog = {
              "schema_version": 1,
              "dataset_id": "locklearn:dataset:japanese-starter",
              "releases": [
                  {
                      "version": "1.0.0",
                      "artifact_url": (
                          "https://raw.githubusercontent.com/rfrachot/LockLearn/main/"
                          "custom_components/locklearn/datasets/bundled/"
                          "japanese-starter-1.0.0.zip"
                      ),
                      "artifact_sha256": digest,
                      "artifact_size": size,
                      "changelog": "Initial bundled Japanese Starter dataset.",
                      "release_url": (
                          "https://github.com/rfrachot/LockLearn/blob/main/"
                          "DATA_UPDATES.md"
                      ),
                  }
              ],
          }
          Path("datasets/manifests/japanese-starter-catalog.json").write_text(
              json.dumps(catalog, indent=2) + "\n", encoding="utf-8"
          )

          definitions = {
              "schema_version": 1,
              "cumulative_installed_warning_bytes": 524288000,
              "datasets": [
                  {
                      "dataset_id": "locklearn:dataset:japanese-starter",
                      "name": "Japanese Starter",
                      "catalog_url": (
                          "https://raw.githubusercontent.com/rfrachot/LockLearn/main/"
                          "datasets/manifests/japanese-starter-catalog.json"
                      ),
                      "artifact_hosts": ["raw.githubusercontent.com"],
                      "artifact_max_bytes": 10485760,
                  }
              ],
          }
          Path(
              "custom_components/locklearn/datasets/resources/official_datasets.json"
          ).write_text(json.dumps(definitions, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Validate generated starter
        run: |
          python datasets/tools/validate_resources.py
          python -m pytest -q --tb=short             tests/datasets/test_dataset_package.py             tests/datasets/test_build_pipeline.py             tests/datasets/test_dataset_manager.py
      - name: Commit bundled signed artifact
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             custom_components/locklearn/datasets/bundled/japanese-starter-1.0.0.zip             custom_components/locklearn/datasets/resources/signing_keys.json             custom_components/locklearn/datasets/resources/bundled_datasets.json             custom_components/locklearn/datasets/resources/official_datasets.json             datasets/manifests/japanese-starter-catalog.json
          git commit -m "build(data): bundle signed Japanese Starter"
          git push origin HEAD:feat/p1-content-core
