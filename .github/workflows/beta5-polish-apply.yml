name: Beta5 polish apply

on:
  push:
    branches:
      - feat/beta5-field-polish-v04
    paths:
      - scripts/apply_beta5_polish_v04.py
      - .github/workflows/beta5-polish-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta5-field-polish-v04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply source transforms
        run: python scripts/apply_beta5_polish_v04.py
      - name: Remove one-shot helpers
        run: |
          rm scripts/apply_beta5_polish_v04.py
          rm .github/workflows/beta5-polish-apply.yml
      - name: Commit transformed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(beta5): implement field polish v0.4"
          git push origin HEAD:feat/beta5-field-polish-v04
