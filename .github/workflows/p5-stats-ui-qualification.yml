name: P5.7 stats UI qualification

on:
  push:
    branches: [feat/p5-stats-ui]

permissions:
  contents: write

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          check-latest: true
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy custom_components datasets tests
      - run: python datasets/tools/validate_resources.py
      - run: python -m pytest -q --tb=short

  home-assistant-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            python: "3.13"
            harness: "0.13.215"
            frontend: "20250221.0"
          - name: latest
            python: "3.14"
            harness: "0.13.366"
            frontend: "20260826.7"
    name: HA ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          pytest-homeassistant-custom-component==${{ matrix.harness }}
          home-assistant-frontend==${{ matrix.frontend }}
      - run: python -m pytest -q --tb=short tests/backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: p5-stats-ui-bundle
          path: custom_components/locklearn/frontend/locklearn-panel.js
          if-no-files-found: error
      - name: Materialize bundled panel
        working-directory: ${{ github.workspace }}
        run: |
          if git diff --quiet -- custom_components/locklearn/frontend/locklearn-panel.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/locklearn/frontend/locklearn-panel.js
          git commit -m "build(frontend): materialize P5.7 bundle"
          git push origin HEAD:feat/p5-stats-ui
