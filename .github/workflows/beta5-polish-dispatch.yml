name: Beta5 polish final CI dispatch

on:
  push:
    branches:
      - feat/beta5-field-polish-v04
    paths:
      - .github/workflows/beta5-polish-dispatch.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta5-field-polish-v04
          fetch-depth: 0
      - name: Remove dispatcher and commit final candidate
        run: |
          rm .github/workflows/beta5-polish-dispatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(beta5): finalize polish candidate"
          git push origin HEAD:feat/beta5-field-polish-v04
      - name: Dispatch canonical CI on final HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref feat/beta5-field-polish-v04
