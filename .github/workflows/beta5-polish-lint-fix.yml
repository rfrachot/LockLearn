name: Beta5 polish final lint fix

on:
  push:
    branches:
      - feat/beta5-field-polish-v04
    paths:
      - .github/workflows/beta5-polish-lint-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta5-field-polish-v04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          check-latest: true
      - name: Sort imports and verify backend style
        run: |
          python -m pip install ruff
          python -m ruff check --fix custom_components/locklearn/core/session_selection.py
          python -m ruff format --check custom_components/locklearn/core/session_selection.py tests/backend/test_beta5_polish.py tests/backend/test_session_selection.py
          python -m ruff check custom_components/locklearn/core/session_selection.py tests/backend/test_beta5_polish.py tests/backend/test_session_selection.py custom_components/locklearn/api/beta5_polish.py
      - name: Remove one-shot workflow and commit candidate
        run: |
          rm .github/workflows/beta5-polish-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- . ':(exclude)custom_components/locklearn/frontend/locklearn-panel.js'
          git commit -m "style(beta5): sort field-polish backend imports"
          git push origin HEAD:feat/beta5-field-polish-v04
      - name: Dispatch canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref feat/beta5-field-polish-v04
