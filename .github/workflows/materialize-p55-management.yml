name: Materialize P5.5 management view
on:
  push:
    branches: [feat/p5-frontend]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p5-frontend
      - name: Materialize management view
        env:
          DATA: 
        run: |
          python - <<'PY'
          import base64, gzip, os, pathlib
          payload = gzip.decompress(base64.b64decode(os.environ["DATA"]))
          path = pathlib.Path("frontend/src/management-view.ts")
          path.write_bytes(payload)
          PY
      - name: Commit generated source
        run: |
          git add frontend/src/management-view.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat(management): add P5.5 management surfaces"
            git push origin HEAD:feat/p5-frontend
          fi
