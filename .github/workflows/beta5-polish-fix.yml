name: Beta5 polish fix

on:
  push:
    branches:
      - feat/beta5-field-polish-v04
    paths:
      - scripts/fix_beta5_polish_ci.py
      - .github/workflows/beta5-polish-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta5-field-polish-v04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply test fixture updates
        run: python scripts/fix_beta5_polish_ci.py
      - name: Backend targeted regressions
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/backend/test_beta5_polish.py --tb=short
      - name: Frontend unit/build
        working-directory: frontend
        run: |
          npm install
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run check:bundle
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Remove one-shot helpers
        run: |
          rm scripts/fix_beta5_polish_ci.py
          rm .github/workflows/beta5-polish-fix.yml
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(beta5): qualify field-polish contracts"
          git push origin HEAD:feat/beta5-field-polish-v04
      - name: Dispatch canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref feat/beta5-field-polish-v04
