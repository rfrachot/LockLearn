[project]
name = "locklearn-dev"
version = "0.0.1"
description = "Development tooling for the LockLearn Home Assistant integration"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".git", ".venv", "build", "dist", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = '(^|/)(\.venv|build|dist|frontend/node_modules)/'

[[tool.mypy.overrides]]
module = "pytest_homeassistant_custom_component.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
